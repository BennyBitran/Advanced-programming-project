version: '3.8'

services:
  # MAIN SERVER
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpp_server
    ports:
      - "8080:8080"
    volumes:
      - ./files:/usr/files
    environment:
      - FILES_DIR=/usr/files   
    stdin_open: true
    tty: true
    command: ./runProject 8080 5  #arguments for main

  # TESTS
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: cpp_tests
    network_mode: service:server
    depends_on:
      - server

  # C++ CLIENT
  client_cpp:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cpp_client_runner
    network_mode: service:server
    # Running the compiled C++ client
    command: ./cpp_client 127.0.0.1 8080
    stdin_open: true
    tty: true

  # PYTHON CLIENT
  client_py:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: py_client_runner
    network_mode: service:server
    # Running the Python client
    command: python3 Client.py 127.0.0.1 8080
    stdin_open: true
    tty: true

  # WEB SERVER
  webserver:
    build:
      context: ./WebServer
      dockerfile: Dockerfile
    container_name: node_webserver
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_HOST=server
      - BACKEND_PORT=8080
    depends_on:
      - server

  # FRONTEND (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - REACT_APP_API_BASE=http://localhost:3000
    depends_on:
      - webserver
